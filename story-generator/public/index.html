<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <h1>Story Generator</h1>
        <div class="header-buttons">
          <button id="llm-log-btn" class="menu-btn">LLM Log</button>
          <button id="menu-btn" class="menu-btn">Saved Stories</button>
        </div>
      </div>
      <div class="controls">
        <div class="controls-top">
          <div class="seed-area">
            <textarea id="seed" placeholder="Enter your story seed... e.g., 'Two survivors of a plane crash in the desert. Sarah is a doctor, Mike is an engineer. They must find water and shelter.'"></textarea>
            <div id="turn-progress" class="turn-progress hidden">
              <div class="progress-spinner"></div>
              <span id="progress-text">Processing...</span>
              <button id="cancel-progress-btn" class="cancel-progress-btn hidden">Stop</button>
            </div>
          </div>
          <div class="buttons">
            <button id="start-btn">Start Story</button>
            <div class="turn-controls">
              <button id="turn-btn" disabled>Next Turn</button>
              <input type="number" id="turn-count" value="1" min="1" max="100" title="Number of turns">
            </div>
            <button id="write-chapter-btn" disabled title="Write a novel chapter from recent events">Write Chapter</button>
            <span id="status-line"></span>
          </div>
        </div>
        <div class="options-row">
          <div class="model-selects">
            <div class="model-select-group">
              <label for="model-dm">DM:</label>
              <select id="model-dm" title="Model for Dungeon Master (world, resolution)">
                <option value="">Loading...</option>
              </select>
              <input type="text" id="dm-author-style" class="author-style-input" placeholder="DM style" title="Author style for DM narrative (leave blank for neutral)">
            </div>
            <div class="model-select-group">
              <label for="model-character">Character:</label>
              <select id="model-character" title="Model for character actions and dialogue">
                <option value="">Loading...</option>
              </select>
              <input type="text" id="character-author-style" class="author-style-input" placeholder="Character style" title="Author style for character responses (leave blank for neutral)">
            </div>
            <div class="model-select-group">
              <label for="model-narrator">Narrator:</label>
              <select id="model-narrator" title="Model for novel chapter writing">
                <option value="">Loading...</option>
              </select>
              <input type="text" id="author-style" class="author-style-input" placeholder="Novel style" title="Author style for novel generation (leave blank for AI to choose)">
            </div>
          </div>
        </div>
      </div>
      <div class="dm-controls" id="dm-controls" style="display: none;">
        <input type="text" id="dm-instructions" placeholder="Optional DM instructions for next turn (e.g., 'A snake appears', 'It starts raining')">
      </div>
    </header>

    <div id="story-menu" class="story-menu hidden">
      <div class="story-menu-content">
        <div class="story-menu-header">
          <h2>Saved Stories</h2>
          <button id="menu-close-btn" class="close-btn">&times;</button>
        </div>
        <div class="story-menu-options">
          <label>
            <input type="checkbox" id="generate-images-checkbox">
            Generate missing images on load
          </label>
        </div>
        <div id="story-list" class="story-list">
          <p class="placeholder">Loading stories...</p>
        </div>
      </div>
    </div>

    <div id="story-viewer" class="story-viewer hidden">
      <div class="story-viewer-content">
        <div class="story-viewer-header">
          <h2 id="story-viewer-title">Story</h2>
          <button id="viewer-close-btn" class="close-btn">&times;</button>
        </div>
        <div id="story-viewer-body" class="story-viewer-body">
        </div>
      </div>
    </div>

    <div id="llm-log-menu" class="story-menu hidden">
      <div class="story-menu-content llm-log-content">
        <div class="story-menu-header">
          <h2>LLM Log</h2>
          <button id="llm-log-close-btn" class="close-btn">&times;</button>
        </div>
        <div id="llm-log-list" class="llm-log-list">
          <p class="placeholder">Start or load a story to see LLM logs</p>
        </div>
      </div>
    </div>

    <main>
      <div class="left-panel">
        <div class="story-section" id="story-section">
          <h2>Story</h2>
          <div id="story-content"></div>
          <div class="resize-handle" id="story-resize-handle"></div>
        </div>
        <div class="world-section">
          <h2>World State</h2>
          <div id="world-state">
            <p class="placeholder">Start a game to see world state</p>
          </div>
        </div>
      </div>

      <div class="right-panel">
        <div class="characters-section">
          <h2>Characters</h2>
          <div id="character-display">
            <p class="placeholder">Character stats will appear here</p>
          </div>
        </div>
        <div class="map-section">
          <h2>Map</h2>
          <div id="map-container">
            <svg id="game-map" viewBox="-5000 -5000 10000 10000" preserveAspectRatio="xMidYMid meet">
              <defs>
                <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                  <path d="M0,0 L6,3 L0,6 Z" fill="#4fc3f7"/>
                </marker>
              </defs>
              <g class="map-grid"></g>
              <g class="map-paths"></g>
              <g class="map-features"></g>
              <g class="map-objects"></g>
              <g class="map-characters"></g>
            </svg>
            <p class="placeholder">Start a game to see map</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <p>Processing...</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
